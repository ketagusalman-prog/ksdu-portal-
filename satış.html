<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>M4 Performans | Kayıt ve Düzenleme</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --success: #10b981; --text: #f8fafc; --border: rgba(255,255,255,0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 20px; background: var(--card); border-radius: 15px; border: 1px solid var(--border); }
        .btn-sync { background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .table-container { background: var(--card); border-radius: 15px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { background: rgba(59, 130, 246, 0.1); padding: 15px; text-align: left; font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        input { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 100%; font-size: 13px; outline: none; }
        input:focus { border-color: var(--accent); }
        input[readonly] { background: transparent; border: none; font-weight: 800; color: #94a3b8; cursor: default; }
        .btn-save { background: var(--success); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.2s; }
        .btn-save:hover { opacity: 0.8; }
        #statusPopup { position: fixed; bottom: 20px; right: 20px; padding: 15px 30px; border-radius: 12px; color: white; font-weight: 700; display: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="statusPopup"></div>

<div class="header">
    <div>
        <h1 style="font-weight: 800; font-size: 24px; letter-spacing: -1px;">M4 Performans Yönetimi</h1>
        <p style="color: #94a3b8; font-size: 13px;">Bağlı URL: ...sVQQ/exec</p>
    </div>
    <button class="btn-sync" onclick="verileriCek()">🔄 Listeyi Yenile</button>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th style="width: 80px;">Sicil</th>
                <th>İsim</th>
                <th>Mağaza</th>
                <th>Vardiya</th>
                <th>TL Ciro</th>
                <th>Euro Ciro</th>
                <th>Adet</th>
                <th>Fiş</th>
                <th style="width: 100px;">İşlem</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="9" style="text-align:center; padding:50px; color:#94a3b8;">Veriler yükleniyor...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWYGZ7rWKB-IRjL2t1JW8QDqIPRFAZzcVbGVwKO13pYwNhAB86tklN5BqjLRv0dxYJEA/exec";

    function showStatus(text, color) {
        const popup = document.getElementById('statusPopup');
        popup.innerText = text; popup.style.background = color; popup.style.display = 'block';
        setTimeout(() => { popup.style.display = 'none'; }, 3000);
    }

    async function verileriCek() {
        const tbody = document.getElementById('tableBody');
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            tbody.innerHTML = '';
            data.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td><input type="text" id="sicil_${p.sicil}" value="${p.sicil}" readonly></td>
                    <td><input type="text" id="isim_${p.sicil}" value="${p.isim}"></td>
                    <td><input type="text" id="mag_${p.sicil}" value="${p.magaza}"></td>
                    <td><input type="text" id="var_${p.sicil}" value="${p.vardiya}"></td>
                    <td><input type="number" id="tl_${p.sicil}" value="${p.tl}"></td>
                    <td><input type="number" id="euro_${p.sicil}" value="${p.euro}"></td>
                    <td><input type="number" id="adet_${p.sicil}" value="${p.adet}"></td>
                    <td><input type="number" id="fis_${p.sicil}" value="${p.fis}"></td>
                    <td><button class="btn-save" onclick="kaydet('${p.sicil}')">GÜNCELLE</button></td>
                    <input type="hidden" id="poz_${p.sicil}" value="${p.pozisyon}">
                    <input type="hidden" id="mgr_${p.sicil}" value="${p.magazaGrubu}">
                    <input type="hidden" id="grup_${p.sicil}" value="${p.grup}">
                </tr>`;
            });
        } catch (e) { showStatus("Veri çekilemedi!", "#ef4444"); }
    }

    async function kaydet(sicil) {
        const btn = event.target;
        const payload = {
            sicil: document.getElementById(`sicil_${sicil}`).value,
            isim: document.getElementById(`isim_${sicil}`).value,
            magaza: document.getElementById(`mag_${sicil}`).value,
            vardiya: document.getElementById(`var_${sicil}`).value,
            tl: document.getElementById(`tl_${sicil}`).value,
            euro: document.getElementById(`euro_${sicil}`).value,
            adet: document.getElementById(`adet_${sicil}`).value,
            fis: document.getElementById(`fis_${sicil}`).value,
            pozisyon: document.getElementById(`poz_${sicil}`).value,
            magazaGrubu: document.getElementById(`mgr_${sicil}`).value,
            grup: document.getElementById(`grup_${sicil}`).value
        };
        
        btn.innerText = "⏳...";
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.text();
            if (result === "Veri Güncellendi") {
                showStatus("Başarıyla Güncellendi", "#10b981");
                btn.innerText = "GÜNCELLE";
            }
        } catch (e) { showStatus("Hata oluştu!", "#ef4444"); btn.innerText = "HATA"; }
    }
    window.onload = verileriCek;
</script>
</body>
</html>
