<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>M4 | Üst Düzey Performans Analizi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f1f5f9; --primary: #0f172a; --accent: #3b82f6; --gold: #f59e0b; --danger: #ef4444; --warning: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); padding: 25px; color: #1e293b; }
        .container { max-width: 1600px; margin: auto; }
        
        .val-badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-right: 4px; }
        .val-fis { background: #e0f2fe; color: #0369a1; }
        .val-tl { background: #dcfce7; color: #166534; }
        .val-eur { background: #fef3c7; color: #92400e; }

        .rank-star { font-size: 18px; margin-right: 5px; }
        .top-performer { background: linear-gradient(90deg, #fff7ed, #ffffff); border-left: 4px solid var(--gold) !important; }
        .low-performer { border-left: 4px solid var(--danger) !important; }

        .filter-card { background: var(--primary); padding: 20px; border-radius: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .filter-group label { color: #94a3b8; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: 800; }
        .filter-group select, .filter-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; outline: none; transition: 0.3s; }

        .main-card { background: white; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); overflow: hidden; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 18px; text-align: left; font-size: 12px; font-weight: 800; color: #64748b; border-bottom: 2px solid #f1f5f9; }
        td { padding: 16px; border-bottom: 1px solid #f1f5f9; transition: 0.2s; }
        
        .note-cell { max-width: 250px; cursor: pointer; }
        .note-box { background: #fdf6b2; color: #723b13; padding: 10px; border-radius: 10px; font-size: 12px; line-height: 1.4; border: 1px dashed #e7d48d; min-height: 40px; }

        #modalOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.7); z-index:99; backdrop-filter: blur(8px); }
        #commentModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:35px; border-radius:28px; z-index:100; width:500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .btn-action { padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
        .btn-save { background: var(--accent); color: white; }

        .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; margin-top: 4px; display: inline-block; }
        .tag-alert { background: #fee2e2; color: #991b1b; }
        .tag-ok { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div id="modalOverlay" onclick="closeModal()"></div>
<div id="commentModal">
    <div style="display:flex; justify-content:space-between; align-items:start;">
        <div>
            <h2 id="modalTitle" style="font-weight:800; letter-spacing:-1px;">Not Düzenle</h2>
            <p id="modalSub" style="color:#64748b; font-size:13px; margin-bottom:20px;"></p>
        </div>
        <button onclick="closeModal()" style="background:none; border:none; font-size:24px; cursor:pointer;">×</button>
    </div>
    <textarea id="adminComment" style="width:100%; height:150px; padding:15px; border-radius:15px; border:2px solid #e2e8f0; font-size:14px; outline:none;" placeholder="Notunuzu yazın..."></textarea>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button class="btn-action" style="background:#f1f5f9;" onclick="closeModal()">Vazgeç</button>
        <button id="saveBtn" class="btn-action btn-save">Değişiklikleri Kaydet</button>
    </div>
</div>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <div>
            <h1 style="font-weight:800; font-size:32px; letter-spacing:-1.5px; color:var(--primary);">Akıllı Performans Analizi</h1>
            <p id="group-stats" style="color:#64748b; font-weight:500;">Grup istatistikleri yükleniyor...</p>
        </div>
        <button onclick="verileriGetir()" style="background:white; border:1px solid #e2e8f0; padding:12px 20px; border-radius:12px; font-weight:700; cursor:pointer;">
            <span id="loader">🔄</span> Verileri Tazele
        </button>
    </div>

    <div class="filter-card">
        <div class="filter-group"><label>Mağaza Alanı</label><select id="fMagaza" onchange="analizEt()"></select></div>
        <div class="filter-group"><label>Grup / Ekip</label><select id="fGrup" onchange="analizEt()"></select></div>
        <div class="filter-group"><label>Vardiya Düzeni</label><select id="fVardiya" onchange="analizEt()"></select></div>
        <div class="filter-group"><label>Hızlı Arama</label><input type="text" id="fIsim" onkeyup="analizEt()" placeholder="İsim veya Sicil..."></div>
    </div>

    <div class="main-card">
        <table>
            <thead>
                <tr>
                    <th>Sıralama</th>
                    <th>Personel Detay</th>
                    <th>Çalışma Periyodu</th>
                    <th>Satış Performansı (Canlı)</th>
                    <th>Başarı Skoru</th>
                    <th>Yönetici Geri Bildirimi</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="6" style="text-align:center; padding:100px; color:#64748b;">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVZ7VcV3Nob8Z2eEVrTSECZAlVbPH0eOikAJ585JEPdebcXMhvXw8DwF_T8UoM-TufsQ/exec";
    let dataGlobal = [];
    let currentSicil = "";
    let sheetEuroRate = 36.50;

    async function verileriGetir() {
        const loader = document.getElementById('loader');
        loader.style.display = "inline-block";
        try {
            const res = await fetch(SCRIPT_URL);
            const responseData = await res.json();
            sheetEuroRate = parseFloat(responseData.kur) || 36.50;
            dataGlobal = responseData.data.filter(x => x.sicil && x.isim);
            setupFilters();
            analizEt();
        } catch (e) {
            document.getElementById('tbody').innerHTML = '<tr><td colspan="6">Hata! Veriler çekilemedi.</td></tr>';
        } finally {
            loader.style.display = "none";
        }
    }

    function setupFilters() {
        const filters = { magaza: 'fMagaza', grup: 'fGrup', vardiya: 'fVardiya' };
        for (let key in filters) {
            const select = document.getElementById(filters[key]);
            const vals = [...new Set(dataGlobal.map(x => String(x[key] || "Tanımsız").trim()))];
            select.innerHTML = `<option value="Hepsi">Tüm ${key.toUpperCase()}</option>`;
            vals.forEach(v => { if(v !== "Tanımsız") select.innerHTML += `<option value="${v}">${v}</option>`; });
        }
    }

    function analizEt() {
        const fM = document.getElementById('fMagaza').value;
        const fG = document.getElementById('fGrup').value;
        const fV = document.getElementById('fVardiya').value;
        const fS = document.getElementById('fIsim').value.toLowerCase();
        const EUR_RATE = sheetEuroRate;

        let filtered = dataGlobal.filter(p => {
            return (fM === "Hepsi" || String(p.magaza).trim() === fM) &&
                   (fG === "Hepsi" || String(p.grup).trim() === fG) &&
                   (fV === "Hepsi" || String(p.vardiya).trim() === fV) &&
                   (p.isim.toLowerCase().includes(fS) || String(p.sicil).includes(fS));
        });

        const fisList = filtered.map(p => parseFloat(p.fis) || 0);
        const meanFis = fisList.reduce((a, b) => a + b, 0) / (fisList.length || 1);
        const stdDevFis = Math.sqrt(fisList.map(x => Math.pow(x - meanFis, 2)).reduce((a, b) => a + b, 0) / (fisList.length || 1));

        const totalCiro = filtered.reduce((acc, p) => acc + (parseFloat(p.tl) || 0) + ((parseFloat(p.euro) || 0) * EUR_RATE), 0);
        const totalFis = fisList.reduce((a, b) => a + b, 0) || 1;
        const grupFisBasiCiro = totalCiro / totalFis;

        filtered.forEach(p => {
            const fis = parseFloat(p.fis) || 0;
            const ciro = (parseFloat(p.tl) || 0) + ((parseFloat(p.euro) || 0) * EUR_RATE);
            p.toplamTL = ciro; 
            
            const personelFisBasiCiro = ciro / (fis || 1);
            let score = ((fis * 1.5) * 0.60) + ((ciro / 1500) * 0.40);
            
            // GECE KATSAYISI 1.25 OLARAK GÜNCELLENDİ
            const isNight = (p.vardiya || "").toLowerCase().includes("gece");
            p.finalScore = isNight ? score * 1.25 : score;
            
            p.devStatus = fis < (meanFis - stdDevFis) ? "KRİTİK FİŞ" : (fis < meanFis ? "ORTALAMA ALTI" : "BAŞARILI");

            const tolerans = fis > (meanFis * 1.2) ? 0.7 : 0.85;
            const esikDeger = grupFisBasiCiro * tolerans;

            if (personelFisBasiCiro < esikDeger && fis > 0) {
                p.upsellNeed = "⚠️ KASA ÖNÜ ARTIRILMALI";
                p.upsellStatus = "alert";
            } else if (personelFisBasiCiro > (grupFisBasiCiro * 1.2)) {
                p.upsellNeed = "💎 YÜKSEK VERİMLİLİK";
                p.upsellStatus = "ok";
            } else {
                p.upsellNeed = "SATIŞ DENGELİ";
                p.upsellStatus = "ok";
            }
        });

        filtered.sort((a, b) => b.finalScore - a.finalScore);
        document.getElementById('group-stats').innerText = `Kur: ₺${EUR_RATE.toFixed(2)} | Grup Ortalaması: ${meanFis.toFixed(1)} Fiş | Fiş Başı Ciro Hedefi: ₺${Math.round(grupFisBasiCiro)}`;
        renderTable(filtered, meanFis);
    }

    function renderTable(list, meanFis) {
        const tb = document.getElementById('tbody');
        tb.innerHTML = '';

        list.forEach((p, i) => {
            let star = i === 0 ? "🏆" : (i === 1 ? "⭐" : (i === 2 ? "✨" : "🔹"));
            let rowStyle = p.devStatus === "KRİTİK FİŞ" ? "low-performer" : (i === 0 ? "top-performer" : "");
            
            tb.innerHTML += `
                <tr class="${rowStyle}">
                    <td><span class="rank-star">${star}</span> <b>${i+1}</b></td>
                    <td>
                        <div style="font-weight:800; color:var(--primary); font-size:15px;">${p.isim}</div>
                        <div style="font-size:12px; color:var(--accent); font-weight:700; margin: 2px 0;">Toplam Satış: ₺${Math.round(p.toplamTL).toLocaleString('tr-TR')}</div>
                        <div style="font-size:11px; color:#94a3b8;">ID: ${p.sicil} | ${p.magaza}</div>
                        <span class="status-tag ${p.devStatus === 'BAŞARILI' ? 'tag-ok' : 'tag-alert'}">${p.devStatus}</span>
                        ${p.upsellNeed !== 'SATIŞ DENGELİ' ? `<span class="status-tag ${p.upsellStatus === 'alert' ? 'tag-alert' : 'tag-ok'}">${p.upsellNeed}</span>` : ''}
                    </td>
                    <td><span style="font-size:12px; font-weight:600;">${p.vardiya || 'Belirsiz'}</span></td>
                    <td>
                        <div class="val-badge val-fis">📦 ${Math.round(p.fis)} Fiş</div>
                        <div class="val-badge val-tl">₺ ${Math.round(p.tl).toLocaleString('tr-TR')}</div>
                        <div class="val-badge val-eur">€ ${Math.round(p.euro)}</div>
                    </td>
                    <td>
                        <div style="font-weight:800; font-size:15px; color:${p.finalScore > (meanFis*0.8) ? '#166534' : '#991b1b'}">
                            ${p.finalScore.toFixed(2)}
                        </div>
                    </td>
                    <td class="note-cell" onclick="openComment('${p.sicil}', '${p.isim}', \`${p.not || ''}\`)">
                        <div class="note-box">${p.not || 'Not ekle...'}</div>
                    </td>
                </tr>`;
        });
    }

    function openComment(s, n, nt) {
        currentSicil = s;
        document.getElementById('modalTitle').innerText = n;
        document.getElementById('adminComment').value = (nt === 'undefined' || nt === 'null' || nt === '') ? '' : nt;
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById('commentModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('commentModal').style.display = 'none';
    }

    async function saveComment() {
        const btn = document.getElementById('saveBtn');
        const originalText = btn.innerText;
        const newNote = document.getElementById('adminComment').value;
        btn.innerText = "⏳...";
        btn.disabled = true;
        try {
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ islem: "notKaydet", sicil: currentSicil, not: newNote }) 
            });
            const pIndex = dataGlobal.findIndex(x => String(x.sicil) === String(currentSicil));
            if(pIndex !== -1) dataGlobal[pIndex].not = newNote;
            analizEt();
            closeModal();
        } catch (e) { 
            alert("Hata oluştu, lütfen tekrar deneyin."); 
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    document.getElementById('saveBtn').onclick = saveComment;
    window.onload = verileriGetir;
</script>
</body>
</html>
